<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Association El Badr</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login-styles.css">
    <link rel="stylesheet" href="form-styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <img src="logo.jpeg" alt="Logo El Badr">
                <span>El Badr</span>
            </div>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#apropos">À Propos</a></li>
                <li><a href="login.html" class="btn-secondary">Espace Patient</a></li>
            </ul>
        </div>
    </nav>

    <!-- Reservation Section -->
    <section class="reservation-section">
        <div class="container">
            <div id="reservation-container">
                <!-- Container will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Association El Badr. Tous droits réservés.</p>
        </div>
    </footer>

    <script>
        // Configuration API
        const API_BASE_URL = 'http://localhost:80/api';
        
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const authToken = localStorage.getItem('authToken');
            
            if (authToken) {
                showReservationForm();
            } else {
                showLoginRequired();
            }
            
            // Function to show the reservation form
            function showReservationForm() {
                const container = document.getElementById('reservation-container');
                container.innerHTML = `
                    <div class="reservation-container">
                        <h2 class="section-title">Réserver un hébergement</h2>
                        <p class="section-subtitle">Remplissez le formulaire ci-dessous pour faire une demande de réservation</p>
                        
                        <form id="reservation-form" class="auth-form">
                            <div id="reservation-error-msg" class="error-message" style="display: none;"></div>
                            <div id="reservation-success-msg" class="success-message" style="display: none;"></div>
                            
                            <div class="form-group">
                                <label for="date_arrivee">Date d'arrivée</label>
                                <div class="input-group">
                                    <i class="fas fa-calendar"></i>
                                    <input type="date" id="date_arrivee" name="date_arrivee" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="duree">Durée du séjour (en jours)</label>
                                <div class="input-group">
                                    <i class="fas fa-clock"></i>
                                    <input type="number" id="duree" name="duree" min="1" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="type_maladie">Type de maladie</label>
                                <div class="input-group">
                                    <i class="fas fa-heartbeat"></i>
                                    <input type="text" id="type_maladie" name="type_maladie" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="hopital">Hôpital</label>
                                <div class="input-group">
                                    <i class="fas fa-hospital"></i>
                                    <input type="text" id="hopital" name="hopital" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="nb_accompagnateurs">Nombre d'accompagnateurs</label>
                                <div class="input-group">
                                    <i class="fas fa-users"></i>
                                    <input type="number" id="nb_accompagnateurs" name="nb_accompagnateurs" min="0" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="notes">Notes supplémentaires</label>
                                <div class="input-group">
                                    <i class="fas fa-sticky-note"></i>
                                    <textarea id="notes" name="notes" rows="4"></textarea>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <button type="submit" class="btn-primary">
                                    <i class="fas fa-check-circle"></i> Soumettre ma demande
                                </button>
                            </div>
                            
                            <!-- Debug Section (Remove in production) -->
                           <!-- <div class="debug-section" style="margin-top: 30px; padding: 15px; border: 1px dashed #ddd; border-radius: 6px;">
                                <h3 style="margin-top: 0;">Débogage - Vérifier votre token</h3>
                                <p>Si vous rencontrez des problèmes avec les réservations, vérifiez votre token d'authentification:</p>
                                <button type="button" id="verify-token-btn" class="btn-secondary">
                                    <i class="fas fa-key"></i> Vérifier mon token
                                </button>
                                <div id="token-debug-output" style="margin-top: 10px; padding: 10px; background: #f8f8f8; border-radius: 4px; display: none;"></div>
                            </div> -->
                        </form>
                    </div> 
                `;

                // Add event listener for form submission
                document.getElementById('reservation-form').addEventListener('submit', handleReservationSubmit);
                
                // Add event listener for token verification button
                document.getElementById('verify-token-btn').addEventListener('click', async function() {
                    const token = localStorage.getItem('authToken');
                    const outputDiv = document.getElementById('token-debug-output');
                    
                    if (!token) {
                        outputDiv.innerHTML = 'Aucun token trouvé. Veuillez vous reconnecter.';
                        outputDiv.style.display = 'block';
                        return;
                    }
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/patients/verify-token`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ token })
                        });
                        
                        const data = await response.json();
                        outputDiv.innerHTML = `
                            <p><strong>Statut:</strong> ${response.ok ? 'Valide' : 'Invalide'}</p>
                            <p><strong>Message:</strong> ${data.message || 'Aucun message'}</p>
                            <p><strong>User ID:</strong> ${data.user?.id || 'N/A'}</p>
                            <p><strong>User Role:</strong> ${data.user?.role || 'N/A'}</p>
                        `;
                        outputDiv.style.display = 'block';
                    } catch (error) {
                        outputDiv.innerHTML = `Erreur lors de la vérification: ${error.message}`;
                        outputDiv.style.display = 'block';
                    }
                });
            }

            // Function to show login required message
            function showLoginRequired() {
                const container = document.getElementById('reservation-container');
                container.innerHTML = `
                    <div class="auth-message">
                        <h2 class="section-title">Connexion requise</h2>
                        <p class="section-subtitle">Vous devez être connecté pour effectuer une réservation.</p>
                        <div class="auth-buttons">
                            <a href="login.html" class="btn-primary">
                                <i class="fas fa-sign-in-alt"></i> Se connecter
                            </a>
                            <a href="register.html" class="btn-secondary">
                                <i class="fas fa-user-plus"></i> Créer un compte
                            </a>
                        </div>
                    </div>
                `;
            }

            // Function to handle reservation submission
            async function handleReservationSubmit(event) {
                event.preventDefault();
                
                const dateArrivee = document.getElementById('date_arrivee').value;
                const duree = parseInt(document.getElementById('duree').value);
                const typeMaladie = document.getElementById('type_maladie').value;
                const hopital = document.getElementById('hopital').value;
                const nbAccompagnateurs = parseInt(document.getElementById('nb_accompagnateurs').value);
                const notes = document.getElementById('notes').value;
                
                // Calculate end date
                const dateDebut = new Date(dateArrivee);
                const dateFin = new Date(dateDebut);
                dateFin.setDate(dateFin.getDate() + duree);
                
                const submitButton = document.querySelector('#reservation-form button[type="submit"]');
                const originalText = submitButton.innerHTML;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi en cours...';
                submitButton.disabled = true;
                
                // Hide previous messages
                document.getElementById('reservation-error-msg').style.display = 'none';
                document.getElementById('reservation-success-msg').style.display = 'none';
                
                try {
                    console.log('Getting available beds...');
                    
                    // Get available beds
                    const litsResponse = await fetch(`${API_BASE_URL}/lits/disponibles`);
                    
                    if (!litsResponse.ok) {
                        throw new Error(`Erreur lors de la recherche de lits disponibles: ${litsResponse.statusText}`);
                    }
                    
                    const lits = await litsResponse.json();
                    console.log('Available beds:', lits);
                    
                    if (!lits.length) {
                        throw new Error('Aucun lit disponible pour le moment. Veuillez réessayer plus tard ou contacter l\'administration.');
                    }
                    
                    // Get the current auth token
                    const token = localStorage.getItem('authToken');
                    const userId = localStorage.getItem('userId');
                    const userRole = localStorage.getItem('userRole');
                    
                    if (!token || !userId) {
                        throw new Error('Session expirée. Veuillez vous reconnecter.');
                    }
                    
                    console.log('Creating reservation with user:', { 
                        userId, 
                        role: userRole,
                        tokenLength: token.length
                    });
                    
                    // Create reservation
                    const reservationResponse = await fetch(`${API_BASE_URL}/reservations`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`,
                        },
                        body: JSON.stringify({
                            patient_id: userId,
                            lit_id: lits[0].id,
                            date_debut: dateDebut.toISOString().split('T')[0],
                            date_fin: dateFin.toISOString().split('T')[0],
                            statut: 'en_attente',
                            notes: `Hôpital: ${hopital}, Type de maladie: ${typeMaladie}, ${notes}`,
                        }),
                    });
                    
                    // Handle authentication errors
                    if (reservationResponse.status === 401 || reservationResponse.status === 403) {
                        console.log('Auth error, redirecting to login');
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userId');
                        localStorage.removeItem('userRole');
                        window.location.href = 'login.html?redirect=reservation.html&error=expired';
                        return;
                    }
                    
                    if (!reservationResponse.ok) {
                        const errorData = await reservationResponse.json();
                        throw new Error(errorData.message || 'Erreur lors de la création de la réservation');
                    }
                    
                    const reservationData = await reservationResponse.json();
                    console.log('Reservation created:', reservationData);
                    
                    // Show success message
                    const successMsg = document.getElementById('reservation-success-msg');
                    successMsg.textContent = 'Votre demande de réservation a été enregistrée avec succès ! Nous vous contacterons prochainement.';
                    successMsg.style.display = 'block';
                    
                    // Reset form
                    document.getElementById('reservation-form').reset();
                    
                    // Reset button
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                    
                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 3000);
                } catch (error) {
                    console.error('Reservation error:', error);
                    
                    // Show error message
                    const errorMsg = document.getElementById('reservation-error-msg');
                    errorMsg.textContent = error.message || 'Une erreur est survenue lors de la réservation';
                    errorMsg.style.display = 'block';
                    
                    // Reset button
                    submitButton.innerHTML = originalText;
                    submitButton.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
